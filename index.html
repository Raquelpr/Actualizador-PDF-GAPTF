<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualizador de documentos PDF a la nueva plantilla</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f8fc;color:#26247D;display:grid;place-items:center;min-height:100vh}
.loading{padding:24px 28px;background:#fff;border:1px solid #e5e7ef;border-radius:16px;box-shadow:0 12px 30px rgba(32,36,70,.08);font-weight:700}
</style>
</head>
<body>
<div class="loading" id="loading">Cargando herramienta…</div>
<script>
(async () => {
  try {
    const response = await fetch('./base-v64.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('No se pudo cargar la herramienta base.');
    let html = await response.text();

    const infoBlock = `    <div style="margin:16px 0 20px">
      <details open style="margin-bottom:10px;border:1px solid #dfe3f1;border-radius:12px;background:#fbfcff;padding:14px 16px">
        <summary style="cursor:pointer;font-weight:700;color:#26247D">Antes de empezar</summary>
        <p style="margin:10px 0 0;line-height:1.55">
          Herramienta creada por el <strong>Área de Imagen Corporativa</strong> para actualizar documentos e infografías PDF de la GAPTF
          creados con la plantilla corporativa anterior.
        </p>
        <div class="usage-note">
          Está pensada para documentación propia de la Gerencia, tanto interna como dirigida a personas usuarias.
        </div>
        <p class="info-line soft">
          <span class="info-label">Herramienta de apoyo</span>
          Esta herramienta se ofrece como recurso de apoyo para facilitar la actualización de documentos. Puede funcionar correctamente en muchos casos, pero no garantiza un resultado adecuado con todos los PDF. Si el resultado no es el esperado, será necesario realizar la actualización por otra vía. Revise siempre el documento generado antes de publicarlo.
        </p>
        <div class="local-note">
          <strong>Privacidad.</strong> El PDF se procesa directamente en el navegador: no se envía a servidores, no se almacena y no se guarda historial de los archivos procesados.
        </div>
        <p style="margin:10px 0 0;line-height:1.55">
          Si un documento ya no está vigente, es preferible retirarlo de la intranet en lugar de actualizarlo.
        </p>
      </details>

      <details style="margin-bottom:10px;border:1px solid #dfe3f1;border-radius:12px;background:#fbfcff;padding:14px 16px">
        <summary style="cursor:pointer;font-weight:700;color:#26247D">Qué hace la herramienta</summary>
        <p class="info-line primary">
          <span class="info-label">Documentos</span>
          Sustituye la <strong>cabecera y el pie de página antiguos</strong> por la plantilla corporativa vigente. La página 1 se actualiza siempre; los índices detectados en páginas posteriores se conservan sin cambios.
        </p>
        <p class="info-line soft">
          <span class="info-label">Infografías</span>
          Si la infografía incluye el título en la antigua cabecera, intenta detectarlo y adaptarlo al nuevo formato sin superponerlo al contenido.
        </p>
        <p class="info-line soft">
          <span class="info-label">Formularios y campos rellenables</span>
          La herramienta no bloquea estos PDF, pero no modifica ni comprueba el funcionamiento de sus campos interactivos. Si el archivo contiene formularios, firmas o elementos rellenables, revise especialmente el resultado.
        </p>
        <p class="info-line soft">
          <span class="info-label">Otros documentos</span>
          Si el PDF pertenece a otro organismo o a un ámbito con identidad propia, conviene mantener su formato de origen.
        </p>
      </details>

      <details style="margin-bottom:10px;border:1px solid #dfe3f1;border-radius:12px;background:#fbfcff;padding:14px 16px">
        <summary style="cursor:pointer;font-weight:700;color:#26247D">Antes de publicar</summary>
        <p class="info-line check">
          <span class="info-label">Comprobación final</span>
          Revise el PDF generado y compruebe que el contenido, la maquetación, los enlaces y, si los hubiera, los elementos interactivos siguen funcionando como espera.
        </p>
        <p class="info-line soft">
          <span class="info-label">Si también cambia el contenido</span>
          Cuando sea necesario modificar textos, datos o campos del documento, es preferible hacerlo desde el archivo original. Si necesita apoyo, puede tramitar una incidencia al <strong>Área de Imagen Corporativa</strong>, tipo <strong>«Consulta interdepartamental»</strong>.
        </p>
      </details>
    </div>`;

    const infoStart = html.indexOf('    <div style="margin:16px 0 20px">');
    const formStart = html.indexOf('    <div class="form-panel">', infoStart);
    if (infoStart < 0 || formStart < 0) throw new Error('No se pudo preparar la interfaz.');
    html = html.slice(0, infoStart) + infoBlock + '\n\n' + html.slice(formStart);

    const formBlockStart = html.indexOf('\n    try {\n      const fields = doc.getForm().getFields();');
    const pdfJsStart = html.indexOf('\n\n    const pdfjsDoc = await openPdfJs(bytes);', formBlockStart);
    if (formBlockStart >= 0 && pdfJsStart > formBlockStart) {
      html = html.slice(0, formBlockStart) + html.slice(pdfJsStart);
    }
    html = html.replace(
      '// - formularios/PDF editables: bloqueados;',
      '// - formularios/PDF editables: no se bloquean; requieren revisión del resultado;'
    );

    const excludeBlock = `    const exclude = mode === "documento"
      ? await detectDocumentExcludedPages(pdfjsDoc)
      : new Set();`;
    if (!html.includes(excludeBlock)) throw new Error('No se pudo aplicar la regla de página 1.');
    html = html.replace(
      excludeBlock,
      excludeBlock + `\n\n    // La página 1 se actualiza siempre, aunque el detector la interprete como portada.\n    exclude.delete(1);`
    );

    const headerAnchor = '      // Protección general del contenido inferior: si hay texto o numeración';
    const headerCleanup = `      // Refuerzo de limpieza de la cabecera corporativa antigua.
      if (mode === "documento") {
        try {
          const headerInfo = await pageVisualTextInfo(pdfjsDoc, pageNum);
          const corporateHeaderRx = /(GERENCIA|ATENCI[ÓO]N PRIMARIA|[ÁA]REA DE SALUD|SERVICIO CANARIO|GOBIERNO DE CANARIAS|SANTA CRUZ DE TENERIFE|CARMEN MONTEVERDE|CP\\s*\\d{5}|SEDE\\.|VERIFICA[_-]?DOC|DOCUMENTO ELECTR[ÓO]NICO)/i;
          const corporateItems = headerInfo.items.filter(it =>
            Number.isFinite(it.yTop) && Number.isFinite(it.yBottom) &&
            it.yTop >= 0 && it.yTop < H * 0.24 &&
            corporateHeaderRx.test(it.str || "")
          );

          if (corporateItems.length) {
            const oldHeaderBottom = Math.max(...corporateItems.map(it => it.yBottom));
            let targetClear = oldHeaderBottom + Math.max(5, H * 0.010);
            const bodyTops = headerInfo.items
              .filter(it =>
                Number.isFinite(it.yTop) &&
                it.yTop > oldHeaderBottom + H * 0.004 &&
                !corporateHeaderRx.test(it.str || "") &&
                (it.str || "").trim().length > 2
              )
              .map(it => it.yTop)
              .sort((a,b) => a-b);

            if (bodyTops.length) {
              targetClear = Math.min(targetClear, bodyTops[0] - Math.max(3, H * 0.004));
            }

            const minimumClear = newHeaderH + Math.max(2, H * 0.003);
            clearHeaderH = Math.min(H * 0.22, Math.max(clearHeaderH, minimumClear, targetClear));
          }
        } catch(e) {}
      }
`;
    if (!html.includes(headerAnchor)) throw new Error('No se pudo aplicar la limpieza de cabecera.');
    html = html.replace(headerAnchor, headerCleanup + '\n' + headerAnchor);

    if (html.includes('Los PDF editables no son compatibles') || html.includes('getForm().getFields()')) {
      throw new Error('No se pudo retirar el bloqueo de PDF editables.');
    }
    if (!html.includes('exclude.delete(1);')) {
      throw new Error('No se pudo garantizar la actualización de la página 1.');
    }

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    console.error(error);
    document.getElementById('loading').textContent = 'No se ha podido cargar la herramienta. Recargue la página e inténtelo de nuevo.';
  }
})();
</script>
</body>
</html>
